<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plumb | Tasks, kept straight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2EEF8;--card:#FFFFFF;--ink:#2A1B4D;--muted:#6B6190;--line:#DDD3EE;--brand:#4B2E83;--brand-ink:#FFFFFF;--hi:#B3392A;--md:#8A5F00;--lo:#2F7048;--hi-bg:#FBE6E2;--md-bg:#FBF0D3;--lo-bg:#E0F1E6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17102A;--card:#221A3D;--ink:#EFE9FA;--muted:#A99FCC;--line:#3B3063;--brand:#B79CF2;--brand-ink:#1A1030;--hi:#FF9A8A;--md:#F2C45A;--lo:#8FD3A6;--hi-bg:#4A2430;--md-bg:#43361A;--lo-bg:#1F3F2E}}
:root[data-theme="dark"]{--bg:#17102A;--card:#221A3D;--ink:#EFE9FA;--muted:#A99FCC;--line:#3B3063;--brand:#B79CF2;--brand-ink:#1A1030;--hi:#FF9A8A;--md:#F2C45A;--lo:#8FD3A6;--hi-bg:#4A2430;--md-bg:#43361A;--lo-bg:#1F3F2E}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:1.5rem 1.1rem 3rem}
.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.25rem}
h1{font-size:clamp(2.4rem,9vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.tag{color:var(--muted);margin:.35rem 0 0}
.ring{position:relative;width:4.6rem;height:4.6rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.add{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:1rem;display:grid;gap:.7rem;grid-template-columns:1fr 1fr}
.add .full{grid-column:1/-1}
.add label{font-size:.85rem;font-weight:600;display:block}
.add input,.add select{width:100%;margin-top:.25rem;padding:.6rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.add input:focus,.add select:focus{border-color:var(--brand)}
.addbtn{grid-column:1/-1;border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:.75rem;font-weight:700}
.msg{grid-column:1/-1;min-height:1.1rem;margin:0;font-size:.85rem;color:var(--hi)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:1.3rem 0 .8rem}
.tab{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.9rem}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar select,.bar input{padding:.4rem .6rem;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.bar input{flex:1 1 8rem;min-width:0}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.t{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:12px;padding:.75rem .8rem}
.t.high{border-left-color:var(--hi)}.t.med{border-left-color:var(--md)}.t.low{border-left-color:var(--lo)}
.t input[type=checkbox]{width:1.35rem;height:1.35rem;accent-color:var(--brand)}
.tb label{font-weight:600;cursor:pointer;word-break:break-word}
.t.done .tb label{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.25rem;font-size:.8rem;color:var(--muted)}
.pri{border-radius:999px;padding:0 .55rem;font-weight:600}
.pri.high{background:var(--hi-bg);color:var(--hi)}.pri.med{background:var(--md-bg);color:var(--md)}.pri.low{background:var(--lo-bg);color:var(--lo)}
.od{color:var(--hi);font-weight:600}
.ed{width:100%;padding:.4rem .5rem;border:2px solid var(--brand);border-radius:8px;background:var(--bg)}
.ac{display:flex;gap:.3rem}
.ac button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:.3rem}
.ac button:hover{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:2rem 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;color:var(--muted);font-size:.9rem}
.clear{border:0;background:none;color:var(--muted);text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:.6rem .9rem;display:flex;gap:.9rem;align-items:center;z-index:5}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<main class="app">
  <div class="head">
    <div><h1>Plumb</h1><p class="tag" id="today">Tasks, kept straight.</p></div>
    <div class="ring" role="img" aria-label="Progress"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="arc" cx="30" cy="30" r="26" fill="none" stroke="var(--brand)" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4"/></svg><b id="pct">0%</b></div>
  </div>

  <form class="add" id="f" novalidate>
    <div class="full"><label for="title">New task</label><input id="title" maxlength="120" placeholder="What needs doing?" autocomplete="off"></div>
    <div><label for="pr">Priority</label><select id="pr"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select></div>
    <div><label for="due">Due date</label><input id="due" type="date"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <button class="addbtn" type="submit">Add task</button>
  </form>

  <div class="bar">
    <button class="tab" data-f="all" aria-pressed="true">All <span id="n-all"></span></button>
    <button class="tab" data-f="active" aria-pressed="false">To do <span id="n-active"></span></button>
    <button class="tab" data-f="done" aria-pressed="false">Done <span id="n-done"></span></button>
    <input id="q" type="search" placeholder="Search" aria-label="Search tasks">
    <select id="sort" aria-label="Sort tasks"><option value="new">Newest</option><option value="due">Due date</option><option value="pri">Priority</option></select>
  </div>

  <ul class="list" id="list"></ul>
  <div class="foot"><span id="left" aria-live="polite"></span><button class="clear" id="clear">Clear completed</button></div>
</main>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="plumb-tasks",L={high:"High",med:"Medium",low:"Low"},O={high:0,med:1,low:2};
const seed=()=>[{id:3,t:"Test the checkout on a phone",pr:"high",due:"",done:false},{id:2,t:"Write the About section copy",pr:"med",due:"",done:false},{id:1,t:"Publish the portfolio",pr:"low",due:"",done:true}];
let T,filter="all",sort="new",q="",editing=null,last=null,timer;
try{const r=localStorage.getItem(KEY);T=r?JSON.parse(r):seed()}catch(e){T=seed()}
if(!Array.isArray(T))T=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
$("today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
function render(){
 const td=today(),done=T.filter(t=>t.done).length,pc=T.length?Math.round(done/T.length*100):0;
 $("pct").textContent=pc+"%";$("arc").setAttribute("stroke-dashoffset",(163.4*(1-pc/100)).toFixed(1));
 $("n-all").textContent=T.length;$("n-active").textContent=T.length-done;$("n-done").textContent=done;
 let l=T.filter(t=>(filter==="all"||(filter==="done")===t.done)&&t.t.toLowerCase().includes(q));
 if(sort==="due")l.sort((a,b)=>(a.due||"9")>(b.due||"9")?1:-1);
 else if(sort==="pri")l.sort((a,b)=>O[a.pr]-O[b.pr]);
 else l.sort((a,b)=>b.id-a.id);
 $("list").innerHTML=l.length?l.map(t=>{const od=!t.done&&t.due&&t.due<td;
  const dd=t.due?new Date(t.due+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"";
  return `<li class="t ${t.pr} ${t.done?"done":""}" data-id="${t.id}"><input type="checkbox" id="c${t.id}" data-tog ${t.done?"checked":""}>
  <div class="tb">${editing===t.id?`<input class="ed" id="ed" value="${esc(t.t)}" maxlength="120" aria-label="Edit task">`:`<label for="c${t.id}">${esc(t.t)}</label>`}
  <div class="meta"><span class="pri ${t.pr}">${L[t.pr]}</span>${dd?`<span class="${od?"od":""}">Due ${dd}${od?" (overdue)":""}</span>`:""}</div></div>
  <div class="ac">${editing===t.id?'<button data-save>Save</button>':'<button data-edit>Edit</button>'}<button data-del>Delete</button></div></li>`}).join(""):'<li class="empty">'+(T.length?"Nothing matches.":"No tasks yet. Add your first one above.")+"</li>";
 $("left").textContent=(T.length-done)+(T.length-done===1?" task":" tasks")+" left";
 $("clear").hidden=!done;
 if(editing!==null){const e=$("ed");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
 save();
}
function toast(m){$("tmsg").textContent=m;$("toast").hidden=false;clearTimeout(timer);timer=setTimeout(()=>$("toast").hidden=true,5000)}
$("f").onsubmit=e=>{e.preventDefault();const t=$("title").value.trim();
 if(!t){$("msg").textContent="Give the task a name first.";$("title").focus();return}
 $("msg").textContent="";T.push({id:Date.now(),t,pr:$("pr").value,due:$("due").value,done:false});
 $("title").value="";$("due").value="";render()};
function commit(id){const e=$("ed"),t=T.find(x=>x.id===id);if(e&&t&&e.value.trim())t.t=e.value.trim();editing=null;render()}
$("list").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(!li)return;const id=+li.dataset.id,t=T.find(x=>x.id===id);
 if(e.target.matches("[data-tog]")){t.done=e.target.checked;render()}
 if(e.target.matches("[data-edit]")){editing=id;render()}
 if(e.target.matches("[data-save]"))commit(id);
 if(e.target.matches("[data-del]")){last={t,i:T.indexOf(t)};T=T.filter(x=>x.id!==id);render();toast("Task deleted")}});
$("list").addEventListener("keydown",e=>{if(e.target.id!=="ed")return;const id=editing;if(e.key==="Enter")commit(id);if(e.key==="Escape"){editing=null;render()}});
$("undo").onclick=()=>{if(last){T.splice(last.i,0,last.t);last=null;render()}$("toast").hidden=true};
$("clear").onclick=()=>{T=T.filter(t=>!t.done);render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$("sort").onchange=e=>{sort=e.target.value;render()};
render();
</script>
</body>
</html>
